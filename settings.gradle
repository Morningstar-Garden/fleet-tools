pluginManagement {

    repositories {
        
        maven {
        
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        
        maven {
        
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        
        maven {
        
            name = 'Quilt (Release)'
            url = 'https://maven.quiltmc.org/repository/release'
        }
        
        maven {
        
            name = 'Quilt (Snapshot)'
            url = 'https://maven.quiltmc.org/repository/snapshot'
        }

        maven {
            name = 'Cotton'
            url = 'https://server.bbkr.space/artifactory/libs-release/'
        }

        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'fleettools'
// Fabric-only build. The Common/Forge modules were never wired into the Fabric
// jar (their references are commented out in Fabric/build.gradle) and the Forge
// module no longer exists on disk, so they are excluded from the 26.2 port.
include("Fabric")