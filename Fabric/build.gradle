plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
    id 'idea'
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.shedaniel.me/" }
    mavenCentral()
    maven { url "https://github.com/Serilum/.maven/raw/maven/" }
    maven { url = "https://maven.nucleoid.xyz/" } // Text Placeholder API (StyledChat / StyledPlayerList)
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Minecraft 26.2 ships de-obfuscated (native Mojang names): no mappings, and mod
    // dependencies use plain `implementation` because Loom no longer remaps them.
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // fabric-command-api-v2 is bundled in the full fabric-api above; no separate module needed.
    // Mixin is supplied transitively by fabric-loader and wired up by Loom — do not declare it manually.

    implementation "org.jetbrains:annotations:24.1.0"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    // gson and guava ship inside Minecraft; provided at compile time only.
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'com.google.guava:guava:32.1.2-jre'

    // Fleet Tools dependencies
    implementation "me.lucko:fabric-permissions-api:0.7.0"

    // Text Placeholder API — compile-only soft dependency for StyledChat / StyledPlayerList
    // integration (provided at runtime by those mods; guarded by isModLoaded checks).
    compileOnly "eu.pb4:placeholder-api:3.1.0-beta.1+26.2"

    // LuckPerms API — compile-only soft dependency for the AFK prefix integration
    // (provided at runtime by LuckPerms; guarded by isModLoaded checks).
    compileOnly "net.luckperms:api:5.4"
}

loom {
    // No mixin{} block: Minecraft 26.2 is de-obfuscated, so mixins target real
    // names directly and no refmap / legacy mixin AP is required.

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

version = rootProject.version

processResources {
    from(sourceSets.main.resources) // Ensure Fabric's own resources (including fabric.mod.json) are included
    // from project(":Common").sourceSets.main.resources  // Temporarily disabled
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_name}" }
    }
    // Include Common's compiled classes in the Fabric JAR
    // from(project(":Common").sourceSets.main.output)  // Temporarily disabled
    // Add Implementation-Version to manifest for dynamic version command
    manifest {
        attributes(
            'Implementation-Version': project.version
        )
    }
    // Do not override defaults; compiled classes and resources are included by default
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.name
            version project.version
            from components.java
        }
    }

    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

base {
    archivesName = "fleettools-fabric-${minecraft_version}"
}


